name: SportPulse Worker tests
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

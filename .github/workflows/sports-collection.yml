name: Collecte résultats sportifs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sports-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test normalization
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect results (preserve last good snapshot on error)
        run: python scripts/collect_openligadb.py
      - name: Collect optional F1 and basketball data
        continue-on-error: true
        run: python scripts/collect_extras.py\n      - name: Publish only changed snapshot
        run: |
          git config user.name "sportpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if [ -f data/extras.json ]; then git add data/extras.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update multi-sport data snapshots"
            git push
          else
            echo "No changes"
          fi

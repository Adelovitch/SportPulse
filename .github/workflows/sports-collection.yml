name: Collecte résultats sportifs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '5,25,45 * * * *'
permissions:
  contents: write
concurrency:
  group: sports-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect match window
        id: match_window
        run: python scripts/match_window.py --output "$GITHUB_OUTPUT"
      - name: Test normalization
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect results (preserve last good snapshot on error)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' || steps.match_window.outputs.active == 'true'
        run: python scripts/collect_openligadb.py
      - name: Calculate football standings and recent form
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
        continue-on-error: true
        run: python scripts/collect_analytics.py
      - name: Collect optional F1 and basketball data
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' || steps.match_window.outputs.active == 'true'
        continue-on-error: true
        run: python scripts/collect_extras.py
      - name: Collect available international football competitions (optional)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' || steps.match_window.outputs.active == 'true'
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/collect_football_data.py
      - name: Preserve completed football match history
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' || steps.match_window.outputs.active == 'true'
        run: python scripts/collect_history.py
      - name: Index history by season and competition
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' || steps.match_window.outputs.active == 'true'
        run: python scripts/build_history_index.py
      - name: Publish only changed snapshot
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *' || steps.match_window.outputs.active == 'true'
        run: |
          git config user.name "sportpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if [ -f data/history.json ]; then git add data/history.json; fi
          if [ -f data/history_index.json ]; then git add data/history_index.json; fi
          if [ -f data/extras.json ]; then git add data/extras.json; fi
          if [ -f data/analytics.json ]; then git add data/analytics.json; fi
          if [ -f data/football_data.json ]; then git add data/football_data.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update multi-sport data snapshots"
            git push
          else
            echo "No changes"
          fi
